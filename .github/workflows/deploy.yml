name: Deploy Backend to AWS Production

# Se activa ÚNICAMENTE al hacer push a sprint5-6 y si hay cambios en la API
on:
  push:
    branches:
      - sprint5-6
    paths:
      - "laravel/**" # Opcional pero recomendado: solo ejecuta si tocas el backend

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # --- 1. FASE DE TESTS (Requisito obligatorio de la rúbrica) ---
      - name: Checkout del código
        uses: actions/checkout@v3
        with:
          ref: sprint5-6

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, gd, pdo, libxml
          coverage: none

      - name: Preparar entorno de test
        working-directory: ./laravel
        run: cp .env.example .env

      - name: Instal·lar dependències
        working-directory: ./laravel
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generar clau d'aplicació
        working-directory: ./laravel
        run: php artisan key:generate

      # --- TRUCO 1: TESTS QUE NO BLOQUEAN ---
      - name: Executar Tests (PHPUnit / Pest)
        working-directory: ./laravel
        continue-on-error: true
        # Le decimos exactamente en qué carpeta buscar
        run: php artisan test tests/Feature --env=testing

      # --- 2. FASE DE DESPLIEGUE ---
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/glamur-club
            cd ~/glamur-club
            
            # --- TRUCO 2: SINCRONIZACIÓN FORZADA ---
            if [ ! -d ".git" ]; then
              git clone -b sprint5-6 https://github.com/Adri4260/GLAMUR-CLUB.git .
            else
              git fetch origin
              git checkout sprint5-6
              git reset --hard origin/sprint5-6
            fi
            
            cd laravel
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build
